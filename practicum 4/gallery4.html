<!DOCTYPE html>
<html>

<head>
    <title>Gallery</title>

    <link rel="stylesheet" href="gallery_css4.css">
</head>

<body>

    <h1>Welcome to our Gallery</h1>

    <p class="intro">
        These are some images, audios, and videos we have
    </p>




    <div class="image-gallery">

        <img src="images1.jpg" alt="Blood Donation Image 1">

        <img src="images2.jpg" alt="Blood Donation Image 2">

        <img src="images3.jpg" alt="Blood Donation Image 3">

        <img src="images4.jpg" alt="Blood Donation Image 4">

    </div>




    <div class="media-section">

        <h2>Blood Donation Audio</h2>

        <audio controls>
            <source src="blood donation aud.mp3" type="audio/mp3">
        </audio>

    </div>




    <div class="media-section">

        <h2>Blood Donation Video</h2>

        <video controls>
            <source src="blod donation vid.mp4" type="video/mp4">
        </video>

    </div>




    <div class="media-section">

        <h2>More About Blood Donation</h2>

        <iframe
            src="https://www.youtube.com/embed/Q55LrC7vijM"
            allowfullscreen>
        </iframe>

    </div>


</body>

</html>
