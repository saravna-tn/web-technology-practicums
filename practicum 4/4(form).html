<!DOCTYPE html>
<html>
    <head>
        <title>Blood Donation Registration</title>


        <link rel="stylesheet" href="form_css4.css">
    </head>

    <body>

        <h1>Blood Donation Registration Form</h1>

        <form>

            <label>Donor Name:</label>
            <input type="text" name="name" required>
            <br><br>

            <label>Email:</label>
            <input type="email" name="email" required>
            <br><br>

            <label>Password:</label>
            <input type="password" name="password" minlength="6" required>
            <br><br>

            <label>Age:</label>
            <input type="number" name="age" min="18" max="65" required>
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <br><br>

            <label>Blood Group:</label>
            <select name="bloodgroup" required>
                <option value="">--Select Blood Group--</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>
            <br><br>

            <label>Health Conditions:</label><br>
            <input type="checkbox" name="health" value="none"> None
            <input type="checkbox" name="health" value="diabetes"> Diabetes
            <input type="checkbox" name="health" value="bp"> Blood Pressure
            <br><br>

            <label>Address:</label><br>
            <textarea name="address" rows="4" cols="40" required></textarea>
            <br><br>

            <label>Upload Photo:</label>
            <input type="file" name="photo">
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">

        </form>

    </body>
</html>
